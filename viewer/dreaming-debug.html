<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreaming 运行日志</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #fff;
  --panel-2: #f8f9fb;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e2e4e8;
  --accent: #1769e0;
  --good: #18794e;
  --bad: #c53030;
  --warn: #a15c00;
  --running: #1769e0;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191b;
    --panel: #242529;
    --panel-2: #1e1f22;
    --text: #f2f2f4;
    --muted: #a1a1a8;
    --line: #383a40;
    --accent: #64a7ff;
    --good: #56c58b;
    --bad: #ff7b7b;
    --warn: #f0b45a;
    --running: #64a7ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
code { font-family: var(--mono); }
.shell { max-width: 1500px; margin: 0 auto; padding: 22px; }
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px; margin-bottom: 18px;
}
h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.subtitle { color: var(--muted); margin-top: 4px; }
.actions { display: flex; align-items: center; gap: 12px; }
.refresh {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
  color: var(--text); background: var(--panel);
}
.refresh:hover { border-color: var(--accent); }
.auto { color: var(--muted); white-space: nowrap; }
.auto input { vertical-align: -2px; }
.cards {
  display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr));
  gap: 10px; margin-bottom: 14px;
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px;
}
.card-label { color: var(--muted); font-size: 12px; }
.card-value { margin-top: 3px; font: 600 23px/1.2 var(--mono); }
.card-value.good { color: var(--good); }
.card-value.bad { color: var(--bad); }
.card-value.running { color: var(--running); }
.toolbar {
  display: grid; grid-template-columns: minmax(220px, 1fr) 160px 160px 160px auto;
  gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px; margin-bottom: 14px;
}
.toolbar input, .toolbar select {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 9px; color: var(--text); background: var(--panel-2);
}
.result-count { align-self: center; color: var(--muted); white-space: nowrap; }
.workspace {
  display: grid; grid-template-columns: minmax(440px, 44%) minmax(480px, 1fr);
  gap: 14px; min-height: 560px;
}
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
.panel-head {
  height: 43px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.panel-meta { color: var(--muted); font-size: 12px; font-weight: 400; }
.runs { max-height: calc(100vh - 280px); min-height: 515px; overflow: auto; }
.run {
  width: 100%; display: grid; grid-template-columns: 108px minmax(0, 1fr) auto;
  gap: 10px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; color: var(--text); background: transparent;
}
.run:hover { background: var(--panel-2); }
.run.active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.run-time { color: var(--muted); font: 12px/1.45 var(--mono); }
.run-main { min-width: 0; }
.run-title { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.run-period, .run-id {
  color: var(--muted); font: 11px/1.5 var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.run-id { margin-top: 2px; }
.badge {
  display: inline-flex; align-items: center; border-radius: 999px;
  padding: 2px 7px; font: 600 11px/1.5 var(--mono);
  background: var(--panel-2); border: 1px solid var(--line);
}
.badge.success { color: var(--good); }
.badge.failed { color: var(--bad); }
.badge.partial { color: var(--warn); }
.badge.running { color: var(--running); }
.detail { padding: 16px; max-height: calc(100vh - 280px); min-height: 515px; overflow: auto; }
.empty {
  min-height: 300px; display: grid; place-items: center; text-align: center;
  color: var(--muted); padding: 30px;
}
.detail-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-title strong { font-size: 17px; }
.detail-id { margin: 6px 0 14px; color: var(--muted); font: 12px var(--mono); word-break: break-all; }
.facts {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px; margin-bottom: 18px;
}
.fact { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
.fact-label { color: var(--muted); font-size: 11px; }
.fact-value { margin-top: 2px; font: 12px/1.45 var(--mono); word-break: break-word; }
.timeline { position: relative; }
.event {
  position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr);
  gap: 10px; padding-bottom: 17px;
}
.event:not(:last-child)::before {
  content: ""; position: absolute; left: 8px; top: 16px; bottom: 0;
  width: 1px; background: var(--line);
}
.dot {
  z-index: 1; width: 17px; height: 17px; border: 4px solid var(--panel);
  border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 1px var(--line);
}
.dot.success { background: var(--good); }
.dot.failed { background: var(--bad); }
.dot.partial { background: var(--warn); }
.dot.running { background: var(--running); }
.event-top { display: flex; justify-content: space-between; gap: 10px; }
.event-name { font-weight: 600; }
.event-time { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
.event-fields { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 4px; color: var(--muted); font-size: 12px; }
.event-fields code { color: var(--text); }
.error {
  margin-top: 8px; padding: 8px 10px; border-radius: 7px;
  color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent);
  font-family: var(--mono); font-size: 12px;
}
.result-section { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
.section-title { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
.notice {
  margin-bottom: 10px; padding: 9px 11px; border-radius: 7px;
  color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent);
}
.checks { display: grid; gap: 6px; margin-bottom: 14px; }
.check {
  display: grid; grid-template-columns: 18px 150px minmax(0, 1fr);
  gap: 7px; align-items: start; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2);
}
.check-mark { font-weight: 700; }
.check.pass .check-mark { color: var(--good); }
.check.fail .check-mark { color: var(--bad); }
.check.pending .check-mark, .check.warning .check-mark, .check.noop .check-mark { color: var(--warn); }
.check-name { font-family: var(--mono); font-size: 12px; }
.check-detail { color: var(--muted); font-size: 12px; }
.batch {
  margin-top: 12px; padding: 12px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--panel-2);
}
.batch-head { display: flex; justify-content: space-between; gap: 10px; }
.batch-id { font: 12px var(--mono); word-break: break-all; }
.batch-stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
.finding {
  margin-top: 9px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); overflow: hidden;
}
.finding > summary { cursor: pointer; padding: 10px 11px; font-weight: 600; }
.finding-body { padding: 0 11px 11px; }
.finding-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
.finding-text { margin: 7px 0; }
.finding-label { color: var(--muted); font-size: 11px; font-weight: 600; }
.uncertainties { margin: 5px 0 8px; padding-left: 19px; color: var(--warn); }
.job-note { color: var(--muted); font-size: 12px; margin-top: 3px; }
.repair {
  margin-top: 8px; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--panel-2);
}
.repair-path { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.repair-detail { color: var(--muted); font-size: 12px; margin-top: 3px; }
.evidence {
  margin-top: 8px; padding: 9px 10px; border-left: 3px solid var(--accent);
  background: var(--panel-2); border-radius: 0 7px 7px 0;
}
.evidence-head { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
.evidence-content {
  white-space: pre-wrap; word-break: break-word; font: 12px/1.55 var(--mono);
  max-height: 230px; overflow: auto;
}
.report-summary { white-space: pre-wrap; font-size: 14px; line-height: 1.7; }
.artifact-link { display: inline-block; margin-top: 9px; color: var(--accent); font-weight: 600; }
.json-details { margin-top: 10px; }
.json-details summary { cursor: pointer; color: var(--muted); }
.json-details pre {
  overflow: auto; max-height: 360px; padding: 10px; border-radius: 7px;
  background: var(--panel-2); font: 11px/1.5 var(--mono);
}
.load-error {
  margin-bottom: 14px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line));
  border-radius: 8px; color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--panel));
}
.hidden { display: none; }
@media (max-width: 950px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .toolbar { grid-template-columns: 1fr 1fr; }
  .workspace { grid-template-columns: 1fr; }
  .runs, .detail { max-height: none; min-height: 380px; }
}
@media (max-width: 560px) {
  .shell { padding: 14px; }
  .header { display: block; }
  .actions { margin-top: 12px; }
  .cards, .toolbar, .facts { grid-template-columns: 1fr; }
  .run { grid-template-columns: 90px minmax(0, 1fr); }
  .run > .badge { grid-column: 2; justify-self: start; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <h1>Dreaming 运行日志</h1>
      <div class="subtitle">本地调试视图 · 运行与业务详情仅在本机查看</div>
    </div>
    <div class="actions">
      <button id="refresh" class="refresh" type="button">立即刷新</button>
    </div>
  </header>

  <div id="load-error" class="load-error hidden"></div>

  <section class="panel" aria-label="为什么没跑">
    <div class="panel-head">
      <span>为什么没跑</span>
      <div class="actions">
        <select id="wake-filter" aria-label="唤醒记录"><option value="">最近一次唤醒</option></select>
        <button id="wake-draft" type="button" disabled>生成反馈草稿</button>
        <button id="wake-bundle" type="button" disabled>导出诊断包</button>
      </div>
    </div>
    <div id="diagnosis" class="detail" aria-live="polite">正在读取调度证据…</div>
  </section>
  <section id="feedback-preview" class="panel hidden" aria-label="反馈邮件预览">
    <div class="panel-head"><span>反馈邮件预览</span><a id="open-feedback-mail">打开邮件草稿</a></div>
    <textarea id="feedback-text" readonly rows="12" style="width:100%; box-sizing:border-box"></textarea>
  </section>

  <section class="cards" aria-label="运行概览">
    <div class="card"><div class="card-label">全部运行</div><div id="count-all" class="card-value">0</div></div>
    <div class="card"><div class="card-label">成功</div><div id="count-success" class="card-value good">0</div></div>
    <div class="card"><div class="card-label">失败</div><div id="count-failed" class="card-value bad">0</div></div>
    <div class="card"><div class="card-label">部分完成</div><div id="count-partial" class="card-value">0</div></div>
    <div class="card"><div class="card-label">运行中</div><div id="count-running" class="card-value running">0</div></div>
  </section>

  <section class="toolbar" aria-label="日志筛选">
    <input id="search" type="search" placeholder="搜索 run id、周期、错误码">
    <select id="job-filter">
      <option value="">全部任务</option>
      <option value="process">process</option>
      <option value="morning">morning</option>
      <option value="daily">daily</option>
      <option value="weekly">weekly</option>
      <option value="maintenance">maintenance</option>
      <option value="recovery">recovery</option>
    </select>
    <select id="status-filter">
      <option value="">全部状态</option>
      <option value="success">success</option>
      <option value="failed">failed</option>
      <option value="partial">partial</option>
      <option value="running">running</option>
    </select>
    <select id="time-filter">
      <option value="24h">最近 24 小时</option>
      <option value="7d" selected>最近 7 天</option>
      <option value="30d">最近 30 天</option>
      <option value="all">全部时间</option>
    </select>
    <div id="result-count" class="result-count">0 条</div>
  </section>

  <section class="workspace">
    <div class="panel">
      <div class="panel-head">
        <span>运行记录</span>
        <span id="updated-at" class="panel-meta">尚未加载</span>
      </div>
      <div id="runs" class="runs"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span>阶段详情</span>
        <div class="actions">
          <span id="event-count" class="panel-meta"></span>
          <button id="run-draft" type="button" disabled>生成反馈草稿</button>
          <button id="run-bundle" type="button" disabled>导出诊断包</button>
        </div>
      </div>
      <div id="detail" class="detail">
        <div class="empty">选择左侧运行记录查看阶段时间线</div>
      </div>
    </div>
  </section>
</main>

<script>
const state = { runs: [], selectedRunId: "", detail: null, timer: null };
const el = id => document.getElementById(id);

const JOB_DESCRIPTIONS = {
  process: "采集并分析授权来源，把值得关注的信息沉淀为 Finding。",
  morning: "生成当天晨报，并按配置发送摘要。",
  daily: "生成指定日期的日报；默认未启用。",
  weekly: "生成指定 ISO 周的周报；默认未启用。",
  maintenance: "运行 doctor 检查知识库健康，并执行确定性白名单修复。",
  recovery: "补偿后台异常，例如过期租约、失败回执、待发送 outbox 或缺失审计结果。"
};

const DIAG_LABELS = {
  request: "宿主已唤醒", preflight: "启动检查", scheduler: "调度决定",
  job_decision: "任务决定", started: "已开始", success: "成功", failed: "失败",
  disabled: "未启用", idle: "本轮未领取", busy: "已有任务运行", leased: "已领取",
  not_due: "未到期或本期已完成", waiting_for_user: "等待用户处理", backoff: "等待重试",
  blocked_by_dependency: "等待上游任务", selected: "本轮已领取", due: "已到期",
  running: "运行中", interrupted: "租约已过期", delivered: "已送达",
  pending: "待投递", not_recorded: "没有投递记录",
  WAKE_NOT_OBSERVED: "未观察到宿主启动。可检查宿主的本地任务历史。",
  WAKE_LINK_NOT_RECORDED: "缺少与本次运行关联的宿主唤醒记录。",
  RUN_STATE_WITHOUT_MATCHING_LOG: "有任务状态，但缺少对应的运行日志。",
  SCHEDULER_STATE_UNAVAILABLE: "无法读取调度状态。",
};
const diagLabel = value => DIAG_LABELS[value] || value || "未知";

async function loadDiagnosis() {
  const picker = el("wake-filter");
  const selected = picker.value;
  try {
    const query = new URLSearchParams(selected ? { tick_id: selected } : {});
    const data = await api(`/api/dreaming/diagnose?${query}`);
    if (picker.value !== selected) return;
    picker.replaceChildren(new Option("最近一次唤醒", ""));
    for (const wake of data.recent_wakes || []) {
      picker.add(new Option(`${displayTime(wake.started_at)} · ${diagLabel(wake.status)}`, wake.tick_id));
    }
    if (selected && ![...picker.options].some(option => option.value === selected)) {
      picker.add(new Option("所选历史唤醒", selected));
    }
    picker.value = selected;
    state.tickId = data.tick?.run_id || "";
    for (const id of ["wake-draft", "wake-bundle"]) el(id).disabled = !state.tickId;
    const events = (data.tick?.events || []).map(event =>
      `<li>${esc(displayTime(event.timestamp))} · ${esc(event.job || diagLabel(event.stage))} · ${esc(diagLabel(event.status))}${event.code ? ` · ${esc(event.code)}` : ""}</li>`).join("");
    const jobs = Object.entries(data.jobs || {}).map(([name, job]) =>
      `<li>${esc(name)} · ${esc(diagLabel(job.status))}${job.next_due_at ? ` · 下次 ${esc(displayTime(job.next_due_at))}` : ""}</li>`).join("");
    const run = data.run;
    const runCode = ["failed", "partial"].includes(run?.status)
      ? run.attempt?.code || run.events?.at(-1)?.code : "";
    const runLine = run
      ? `<p>关联任务 ${esc(run.job || "")} · ${esc(diagLabel(run.status))} · ${esc(run.run_id)}${runCode ? ` · ${esc(runCode)}` : ""}${run.delivery ? ` · 投递 ${esc(diagLabel(run.delivery))}` : ""}${run.delivery_code ? ` · ${esc(run.delivery_code)}` : ""}</p>`
      : "";
    el("diagnosis").innerHTML = [
      ...(data.diagnostic_gaps || []).map(gap => `<p>${esc(diagLabel(gap))}</p>`),
      state.tickId ? `<p>唤醒编号 <code>${esc(state.tickId)}</code></p>` : "",
      runLine,
      events ? `<ul>${events}</ul>` : "",
      data.active_lease ? `<p>最近任务心跳 ${esc(displayTime(data.active_lease.last_heartbeat_at))} · ${esc(diagLabel(data.active_lease.status))} · ${esc(data.active_lease.stage || "")}</p>` : "",
      jobs ? `<details><summary>当前任务与下次运行时间</summary><ul>${jobs}</ul></details>` : "",
    ].join("");
  } catch (error) {
    state.tickId = "";
    for (const id of ["wake-draft", "wake-bundle"]) el(id).disabled = true;
    el("diagnosis").textContent = error.message;
  }
}

async function shareFeedback(runId, action) {
  if (!runId) return;
  try {
    const response = await fetch("/api/dreaming/feedback", {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json", "X-Byteworker-Token": new URLSearchParams(location.search).get("api_token") || "" },
      body: JSON.stringify({ run_id: runId, action }),
    });
    if (!response.ok) throw new Error((await response.json()).error?.message || "反馈生成失败");
    if (action === "draft") {
      const draft = await response.json();
      el("feedback-text").value = `收件人 ${draft.to}\n主题 ${draft.subject}\n\n${draft.body}`;
      el("open-feedback-mail").href = draft.mailto;
      el("feedback-preview").classList.remove("hidden");
      el("feedback-text").focus();
      el("feedback-text").select();
      return;
    }
    const url = URL.createObjectURL(await response.blob());
    const download = document.createElement("a");
    download.href = url;
    download.download = `byteworker-${runId}.zip`;
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    showError(error.message);
  }
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function displayTime(value, withDate = true) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat("zh-CN", {
    month: withDate ? "2-digit" : undefined,
    day: withDate ? "2-digit" : undefined,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false,
  }).format(date);
}

function statusClass(status) {
  return ["success", "failed", "partial", "running"].includes(status) ? status : "";
}

function duration(events, recordedMs) {
  if (!events?.length) return "—";
  const start = new Date(events[0].timestamp).getTime();
  const end = new Date(events[events.length - 1].timestamp).getTime();
  if (!Number.isFinite(start) || !Number.isFinite(end)) return "—";
  const seconds = Math.max(0, Math.round((recordedMs ?? end - start) / 1000));
  if (seconds < 60) return `${seconds}s`;
  return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
}

function jobDescription(job) {
  return JOB_DESCRIPTIONS[job] || "后台任务。";
}

function selectedSince() {
  const value = el("time-filter").value;
  if (value === "all") return "";
  const hours = value === "24h" ? 24 : value === "30d" ? 24 * 30 : 24 * 7;
  return new Date(Date.now() - hours * 3600 * 1000).toISOString();
}

function filteredRuns() {
  const query = el("search").value.trim().toLowerCase();
  const job = el("job-filter").value;
  const status = el("status-filter").value;
  return state.runs.filter(run => {
    if (job && run.job !== job) return false;
    if (status && run.status !== status) return false;
    if (!query) return true;
    return [run.run_id, run.period, run.error_code, run.detail_code]
      .some(value => String(value || "").toLowerCase().includes(query));
  });
}

function renderCounts() {
  const count = status => state.runs.filter(run => run.status === status).length;
  el("count-all").textContent = state.runs.length;
  el("count-success").textContent = count("success");
  el("count-failed").textContent = count("failed");
  el("count-partial").textContent = count("partial");
  el("count-running").textContent = count("running");
}

function renderRuns() {
  const runs = filteredRuns();
  el("result-count").textContent = `${runs.length} 条`;
  if (!runs.length) {
    el("runs").innerHTML = '<div class="empty">没有匹配的运行记录</div>';
    return;
  }
  el("runs").innerHTML = runs.map(run => `
    <button class="run ${run.run_id === state.selectedRunId ? "active" : ""}"
            type="button" data-run-id="${esc(run.run_id)}">
      <div class="run-time">${esc(displayTime(run.started_at))}<br>${esc(displayTime(run.updated_at, false))}</div>
      <div class="run-main">
        <div class="run-title">${esc(run.job || "unknown")}</div>
        <div class="job-note">${esc(jobDescription(run.job))}</div>
        <div class="run-period">${esc(run.period || "—")}</div>
        <div class="run-id">${esc(run.run_id)}</div>
      </div>
      <span class="badge ${statusClass(run.status)}">${esc(run.status || "unknown")}</span>
    </button>
  `).join("");
  document.querySelectorAll(".run").forEach(button => {
    button.addEventListener("click", () => loadRun(button.dataset.runId));
  });
}

function eventFields(event) {
  const fields = [];
  if (event.stage) fields.push(`<span>stage <code>${esc(event.stage)}</code></span>`);
  if (event.detail_code) fields.push(`<span>detail <code>${esc(event.detail_code)}</code></span>`);
  if (event.artifact_path) fields.push(`<span>artifact <code>${esc(event.artifact_path)}</code></span>`);
  if (event.digest_run_id) fields.push(`<span>Digest 运行 <code>${esc(event.digest_run_id)}</code></span>`);
  for (const [key, value] of Object.entries(event.metrics || {})) {
    fields.push(`<span>${esc(key)} <code>${esc(value)}</code></span>`);
  }
  return fields.join("");
}

function renderChecks(checks = []) {
  if (!checks.length) return "";
  return `<div class="checks">${checks.map(check => {
    const mark = check.status === "pass" ? "✓" : check.status === "fail" ? "×" : "…";
    return `<div class="check ${esc(check.status)}">
      <span class="check-mark">${mark}</span>
      <span class="check-name">${esc(check.name)}</span>
      <span class="check-detail">${esc(check.detail)}</span>
    </div>`;
  }).join("")}</div>`;
}

function renderRepairs(repairs = []) {
  if (!repairs.length) return '<div class="notice">本轮没有记录自动修复项。</div>';
  return repairs.map(repair => `
    <div class="repair">
      <div class="repair-path">${esc(repair.path || "未知文件")}</div>
      <div><span class="badge">${esc(repair.action || "repair")}</span> ${repair.code ? `<code>${esc(repair.code)}</code>` : ""}</div>
      <div class="repair-detail">${esc(repair.detail || "没有补充说明")}</div>
    </div>
  `).join("");
}

function renderEvidence(evidence = []) {
  if (!evidence.length) return '<div class="notice">没有可展示的 evidence 原文。</div>';
  return evidence.map(item => `
    <div class="evidence">
      <div class="evidence-head">
        ${esc(item.chat_name || item.chat_type || "未知会话")} ·
        ${esc(item.sender_name || "未知发送者")} · ${esc(item.occurred_at || "")}
        · <code>${esc(item.message_id || item.item_id)}</code>
      </div>
      <div class="evidence-content">${esc(item.content || "原文不可用")}${item.content_truncated ? "\n\n[内容已截断]" : ""}</div>
    </div>
  `).join("");
}

function renderFindings(findings = []) {
  if (!findings.length) return '<div class="notice">本批次没有产出 Finding。</div>';
  return findings.map((finding, index) => `
    <details class="finding" data-finding-id="${esc(finding.finding_id || index)}" ${index === 0 ? "open" : ""}>
      <summary>${esc(finding.summary || finding.finding_id)}</summary>
      <div class="finding-body">
        <div class="finding-meta">
          <span class="badge">${esc(finding.kind || "unknown")}</span>
          <span class="badge">${esc(finding.confidence || "unknown")} confidence</span>
          <code>${esc(finding.finding_id)}</code>
        </div>
        <div class="finding-label">为什么重要</div>
        <div class="finding-text">${esc(finding.why_it_matters || "—")}</div>
        <div class="finding-label">不确定性</div>
        ${finding.uncertainties?.length
          ? `<ul class="uncertainties">${finding.uncertainties.map(item => `<li>${esc(item)}</li>`).join("")}</ul>`
          : '<div class="finding-text">无</div>'}
        <div class="finding-label">原始证据</div>
        ${renderEvidence(finding.evidence)}
      </div>
    </details>
  `).join("");
}

function renderResult(result) {
  if (!result) return "";
  if (result.kind === "process") {
    if (!result.available) {
      return '<section class="result-section"><div class="section-title">运行结果</div><div class="notice">没有找到与本轮关联的 EvidenceBatch。若采集失败，这是预期结果；否则说明审计关联缺失。</div></section>';
    }
    const linkage = result.linkage === "explicit"
      ? ""
      : '<div class="notice">历史 run 未记录 batch_id，当前按运行时间窗口关联。未来运行会使用显式关联。</div>';
    return `<section class="result-section">
      <div class="section-title">处理结果与人工复核</div>
      ${linkage}
      ${result.batches.map(batch => `
        <div class="batch">
          <div class="batch-head">
            <span class="batch-id">${esc(batch.batch_id)}</span>
            <span class="batch-stats">${esc(batch.item_count)} 条输入 · ${esc(batch.finding_count)} 个 Finding</span>
          </div>
          <div class="event-fields">
            <span>窗口 <code>${esc(batch.window?.observed_start || batch.window?.requested_start || "—")}</code>
              → <code>${esc(batch.window?.observed_end || batch.window?.requested_end || "—")}</code></span>
            <span>coverage <code>${esc(batch.coverage?.status || "—")}</code></span>
          </div>
          <div class="section-title" style="margin-top:12px">一致性检查</div>
          ${renderChecks(batch.checks)}
          <div class="section-title">Findings</div>
          ${renderFindings(batch.findings)}
        </div>
      `).join("")}
    </section>`;
  }
  if (result.kind === "report") {
    return `<section class="result-section">
      <div class="section-title">报告结果</div>
      ${result.available
        ? `${state.detail.summary?.accounting ? "" : `<div class="report-summary">${esc(result.summary || "摘要为空")}</div>`}
           ${result.html_url ? `<a class="artifact-link" href="${esc(result.html_url + '?api_token=' + encodeURIComponent(new URLSearchParams(location.search).get('api_token') || ''))}" target="_blank">打开完整 HTML 报告 ↗</a>` : ""}
           <details class="json-details"><summary>查看结构化 report.json</summary><pre>${esc(JSON.stringify(result.document, null, 2))}</pre></details>`
        : '<div class="notice">没有找到本轮报告产物。</div>'}
    </section>`;
  }
  if (result.kind === "diagnostic") {
    return `<section class="result-section">
      <div class="section-title">${esc(result.job)} 检查结果</div>
      ${state.detail.summary?.accounting ? "" : `<div class="report-summary">${esc(result.summary || "没有结果摘要")}</div>`}
      <div class="section-title" style="margin-top:14px">检查项</div>
      ${renderChecks(result.checks)}
      <div class="section-title" style="margin-top:14px">自动修复明细</div>
      ${renderRepairs(result.repairs)}
    </section>`;
  }
  return `<section class="result-section">
    <div class="section-title">运行结果</div>
    <div class="notice">${esc(result.limitation || "当前没有可供人工复核的结构化结果。")}</div>
  </section>`;
}

function openFindingIds() {
  return new Set(
    Array.from(document.querySelectorAll(".finding[open]"))
      .map(item => item.getAttribute("data-finding-id"))
      .filter(Boolean)
  );
}

function restoreFindingState(openIds) {
  if (!openIds?.size) return;
  document.querySelectorAll(".finding").forEach(item => {
    if (openIds.has(item.getAttribute("data-finding-id"))) item.open = true;
  });
}

function renderRunSummary(document) {
  const accounting = document?.accounting;
  if (!accounting) return "";
  const operations = accounting.kb_operations;
  const operationLabels = {
    digest_commits: "摄取提交", files_changed: "文件变更", nodes_created: "新增节点",
    nodes_updated: "更新节点", nodes_deleted: "删除节点", reports_written: "归档报告",
    durable_actions: "已提交的持久化动作",
  };
  const sourceStatuses = {
    committed: "已提交", noop: "无变化", empty_window: "空窗口",
    observed: "已扫描", pending: "未登记完成",
  };
  const formatOperations = changes => Object.entries(changes || {}).filter(([key]) => operationLabels[key])
    .map(([key, count]) => `${operationLabels[key]} ${count}`).join(" · ");
  const sources = (accounting.routine_sources || []).map((source, index) => {
    const note = document.source_notes?.[source.source_key];
    const changes = formatOperations(source.kb_operations);
    return `<li><strong>${esc(source.label || `${source.source_type} ${index + 1}`)}</strong>
      · ${esc(sourceStatuses[source.status] || source.status)}${changes ? ` · ${esc(changes)}` : ""}
      ${note ? `<div>${esc(note)}</div>` : ""}</li>`;
  }).concat(
    (accounting.im_sources || []).map(source =>
      `<li>${esc(source.label)} · ${esc(source.item_count)} 条消息</li>`),
    (accounting.report_sources || []).map(source =>
      `<li>${esc(source.label)} · ${esc(source.reference_count)} 条报告引用</li>`),
  );
  const metrics = accounting.metrics || {};
  const counts = [["item_count", "输入"], ["finding_count", "发现"], ["gap_count", "缺口"]]
    .filter(([key]) => key in metrics).map(([key, label]) => `${label} ${metrics[key]}`).join(" · ");
  const review = document.review;
  const reviewDetail = review ? `
    <h3>等待来源复核</h3>
    <p>${esc(review.problem)}</p>
    <p><strong>${esc(review.question)}</strong></p>
    <ol>${review.options.map(option => `<li><strong>${esc(option.action)}</strong> · ${esc(option.effect)}</li>`).join("")}</ol>
    <p>在宿主任务会话回复选项编号，或说明希望处理的范围。</p>`
    : accounting.error_code === "SOURCE_REVIEW_REQUIRED" ? "<p>这次运行没有记录具体的复核问题。</p>" : "";
  return `<section class="result-section">
    <div class="section-title">本轮摘要</div>
    <div class="report-summary">${esc(document.summary)}</div>
    ${reviewDetail}
    ${counts ? `<p>${esc(counts)}</p>` : ""}
    ${operations ? `<p>已核验的知识库变更 · ${esc(formatOperations(operations))}</p>` : ""}
    ${accounting.unaccounted_sources ? `<p>${esc(accounting.unaccounted_sources)} 个来源的变更未核算</p>` : ""}
    ${accounting.reported_repairs != null ? `<p>维护回执记录 ${esc(accounting.reported_repairs)} 项修复</p>` : ""}
    ${sources.length ? `<details open><summary>各来源处理情况</summary><ul>${sources.join("")}</ul></details>` : ""}
  </section>`;
}

function renderDetail(openIds = new Set()) {
  const events = state.detail?.events || [];
  el("event-count").textContent = events.length ? `${events.length} 个事件` : "";
  if (!events.length) {
    el("detail").innerHTML = '<div class="empty">选择左侧运行记录查看阶段时间线</div>';
    return;
  }
  const first = events[0];
  const last = events[events.length - 1];
  const run = state.runDiagnosis?.run;
  el("detail").innerHTML = `
    <div class="detail-title">
      <strong>${esc(first.job || "unknown")}</strong>
      <span class="badge ${statusClass(last.status)}">${esc(last.status || "unknown")}</span>
    </div>
    <div class="job-note">${esc(jobDescription(first.job))}</div>
    <div class="detail-id">${esc(state.detail.run_id)}</div>
    ${run?.delivery ? `<div class="job-note">投递 ${esc(diagLabel(run.delivery))}${run.delivery_code ? ` · ${esc(run.delivery_code)}` : ""}</div>` : ""}
    <div class="facts">
      <div class="fact"><div class="fact-label">周期</div><div class="fact-value">${esc(first.period || "—")}</div></div>
      <div class="fact"><div class="fact-label">总耗时</div><div class="fact-value">${esc(duration(events, state.detail.summary?.accounting?.metrics?.duration_ms))}</div></div>
      <div class="fact"><div class="fact-label">Owner</div><div class="fact-value">${esc(first.owner || "—")}</div></div>
    </div>
    ${renderRunSummary(state.detail.summary)}
    <div class="timeline">
      ${events.map(event => `
        <div class="event">
          <div class="dot ${statusClass(event.status)}"></div>
          <div>
            <div class="event-top">
              <span class="event-name">${esc(event.event || event.stage || "event")}</span>
              <span class="event-time">${esc(displayTime(event.timestamp))}</span>
            </div>
            <div class="event-fields">${eventFields(event)}</div>
            ${event.error_code ? `<div class="error">${esc(event.error_code)}</div>` : ""}
          </div>
        </div>
      `).join("")}
    </div>
    ${renderResult(state.detail.result)}
  `;
  restoreFindingState(openIds);
}

function showError(message = "") {
  el("load-error").textContent = message;
  el("load-error").classList.toggle("hidden", !message);
}

async function api(path) {
  const response = await fetch(path, { cache: "no-store", headers: { "X-Byteworker-Token": new URLSearchParams(location.search).get("api_token") || "" } });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error?.message || `HTTP ${response.status}`);
  return payload;
}

async function loadRun(runId) {
  const preserveOpen = runId === state.selectedRunId ? openFindingIds() : new Set();
  state.selectedRunId = runId;
  for (const id of ["run-draft", "run-bundle"]) el(id).disabled = !/^DR-[a-f0-9]{32}$/.test(runId);
  renderRuns();
  try {
    const encoded = encodeURIComponent(runId);
    const [detail, diagnosis] = await Promise.all([
      api(`/api/dreaming/runs/${encoded}`),
      /^DR-[a-f0-9]{32}$/.test(runId)
        ? api(`/api/dreaming/diagnose?run_id=${encoded}`).catch(() => null)
        : null,
    ]);
    if (state.selectedRunId !== runId) return;
    state.detail = detail;
    state.runDiagnosis = diagnosis;
    showError();
    renderDetail(preserveOpen);
  } catch (error) {
    showError(error.message);
  }
}

function selectedRunSummary() {
  return state.runs.find(run => run.run_id === state.selectedRunId);
}

async function refresh(options = {}) {
  el("refresh").disabled = true;
  try {
    const params = new URLSearchParams({ limit: "500" });
    const since = selectedSince();
    if (since) params.set("since", since);
    const payload = await api(`/api/dreaming/runs?${params.toString()}`);
    state.runs = payload.runs || [];
    renderCounts();
    renderRuns();
    el("updated-at").textContent = `更新于 ${displayTime(new Date().toISOString())}`;
    showError();
      const summary = selectedRunSummary();
      const shouldReloadDetail = options.forceDetail || !state.detail;
      if (state.selectedRunId && !summary) {
        state.selectedRunId = "";
        state.detail = null;
        for (const id of ["run-draft", "run-bundle"]) el(id).disabled = true;
        el("event-count").textContent = "";
        el("detail").innerHTML = state.runs.length
          ? '<div class="empty">当前选择不在时间范围内，请重新选择运行记录</div>'
          : '<div class="empty">没有匹配的运行记录</div>';
      } else if (state.selectedRunId && shouldReloadDetail) {
        await loadRun(state.selectedRunId);
      } else if (!state.selectedRunId && state.runs.length) {
        await loadRun(state.runs[0].run_id);
    }
  } catch (error) {
    showError(error.message);
  } finally {
    el("refresh").disabled = false;
  }
}

el("refresh").addEventListener("click", () => {
  refresh({ forceDetail: true });
  loadDiagnosis();
});
el("wake-filter").addEventListener("change", loadDiagnosis);
for (const [prefix, selection] of [["wake", () => state.tickId], ["run", () => state.selectedRunId]]) {
  for (const action of ["draft", "bundle"]) {
    el(`${prefix}-${action}`).addEventListener("click", () => shareFeedback(selection(), action));
  }
}
["search", "job-filter", "status-filter"].forEach(id => {
  el(id).addEventListener(id === "search" ? "input" : "change", renderRuns);
});
el("time-filter").addEventListener("change", () => {
  state.selectedRunId = "";
  state.detail = null;
  refresh({ forceDetail: true });
});
refresh({ forceDetail: true });
loadDiagnosis();
</script>
</body>
</html>
